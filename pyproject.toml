[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vh-tennis-booker"
dynamic = ["version"]
description = "UI automation case study: booking a tennis court in a Flutter app with uiautomator2"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Hau Pham" }]
requires-python = ">=3.9"
dependencies = [
    "uiautomator2>=3.0",
    "tomli>=2.0; python_version < '3.11'",
    "tomli-w>=1.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
# The local backend of the desktop app; the scheduled run does not need it. Uvicorn
# serves the live feed's WebSocket only with a WebSocket library.
app = ["fastapi>=0.110", "uvicorn>=0.29", "websockets>=12"]
dev = [
    "pytest>=8",
    "ruff==0.17.3",
    "pre-commit>=3.7",
    # FastAPI's test client: Starlette for Python 3.10+ uses httpx2, older ones httpx.
    "httpx>=0.27; python_version < '3.10'",
    "httpx2>=2.0; python_version >= '3.10'",
]

[project.scripts]
court-booker = "court_booker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# The driver APK that runs install on the emulator (tools/build_driver.py).
[tool.setuptools.package-data]
court_booker = ["assets/*"]

[tool.setuptools.dynamic]
version = { attr = "court_booker.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["UP006", "UP007", "UP035", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["court_booker"]
