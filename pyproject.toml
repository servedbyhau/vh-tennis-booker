[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vh-tennis-booker"
dynamic = ["version"]
description = "UI automation case study: booking a tennis court in a Flutter app with uiautomator2"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Hau Pham" }]
requires-python = ">=3.9"
dependencies = [
    "uiautomator2>=3.0",
    "tomli>=2.0; python_version < '3.11'",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.16.10", "pre-commit>=3.7"]

[project.scripts]
court-booker = "court_booker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "court_booker.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["UP006", "UP007", "UP035", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["court_booker"]
