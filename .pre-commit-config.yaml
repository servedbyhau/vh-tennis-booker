repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-toml
      - id: check-yaml
      - id: check-added-large-files
      - id: detect-private-key

  # The Ruff installed from pyproject.toml's pin: a hook repo would hold a second version,
  # which Dependabot does not bump.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: python -m ruff check --force-exclude --fix
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: python -m ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
