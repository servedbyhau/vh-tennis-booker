name: Desktop

# Builds the installer on a Windows runner, which has Rust and the MSVC tools. The app's
# version comes from the code, so it has one home.
on:
  push:
    branches: [main, "feat/desktop-*"]
  workflow_dispatch:

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: pip install -e ".[app,build]"
      - run: npm ci
        working-directory: ui
      - run: python tools/build_app.py
      - run: npm ci
        working-directory: desktop
      - name: Build the installer
        working-directory: desktop
        shell: bash
        run: |
          version=$(python -c "import court_booker; print(court_booker.__version__)")
          echo "{\"version\": \"$version\"}" > version.json
          npx tauri build --config version.json
      - uses: actions/upload-artifact@v7
        with:
          name: court-booker-installer
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: cargo-lock
          path: desktop/src-tauri/Cargo.lock
      - run: cargo test --lib
        working-directory: desktop/src-tauri
