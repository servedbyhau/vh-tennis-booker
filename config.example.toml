# Copy to config.toml and adjust. Omitted keys fall back to built-in defaults.

device = "auto"                     # ADB serial, or "auto" to find the emulator
adb_path = ""                       # adb.exe; empty searches PATH, then the MuMu folder
package = "com.vinhomes.resident"
days_ahead = 2                      # book this many days after today
slots = ["18:00 - 19:00", "19:00 - 20:00"]  # one booking round per slot
court = "S10 - Sân tennis"
venue_keyword = "Origami"           # venue screen, tapped only if shown
timeout = 10                        # seconds to wait for each element
max_swipes = 6                      # scroll attempts when looking for a slot

# Emulator start. Leave mumu_manager empty if you start the emulator yourself.
mumu_manager = "C:/Program Files/Netease/MuMuPlayer/nx_main/MuMuManager.exe"
mumu_index = 0                      # MuMu instance number (0 = first)
boot_timeout = 180                  # seconds to wait for Android and for the app
restart_app = true                  # restart the app for a clean state before booking

# Timed start (court-booker --scheduled waits for start_at).
start_at = "06:00"                  # when the app opens bookings, HH:MM or HH:MM:SS
ntp_server = "time.google.com"      # corrects the PC clock; "" uses the PC clock as is
open_retry_seconds = 60             # keep reloading while the date or slot is not open yet
log_dir = "logs"                    # daily log files, next to this file; "" disables

# Optional: send the summary to Telegram. Create a bot with @BotFather, send it a
# message, then read your chat id from https://api.telegram.org/bot<token>/getUpdates
telegram_token = ""
telegram_chat_id = ""

# Accessibility labels of the target app. They stay in the app's language;
# update them here if the app changes its wording.
[labels]
home = "Tiện ích"
utility = "Sân Tennis"
continue = "Tiếp tục"
confirm = "Xác nhận"
confirm_page = "Xác nhận đăng ký"
prev_month = "Tháng trước"
next_month = "Tháng sau"
agree = "Tôi đã hiểu"
fully_booked = "Hết chỗ"
